name: Dependency merge
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Qualification]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: dependency-merge-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  classify:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: metadata
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPENDENCIES: ${{ steps.metadata.outcome == 'success' && steps.metadata.outputs.updated-dependencies-json || '[]' }}
        with:
          script: |
            await require('./scripts/ci/dependency-merge.cjs').classifyAndFinish(
              {github, context, core}, JSON.parse(process.env.DEPENDENCIES));
  merge:
    if: github.event_name == 'workflow_run' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/ci/dependency-merge.cjs').finish({github, context, core});
