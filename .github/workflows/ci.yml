name: Qualification
run-name: Qualification (${{ inputs.profile || 'full' }})

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        type: choice
        options: [full, deploy]
        default: full
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      source_sha:
        description: Exact release commit to validate
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}-${{ inputs.profile || 'full' }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Correctness / Package and browser
    runs-on: [self-hosted, Linux, X64, nextide-ci-docker]
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate profile
        env:
          PROFILE: ${{ inputs.profile || 'full' }}
        run: |
          case "$PROFILE" in full|deploy) ;; *) echo "Unknown profile: $PROFILE"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Quality
        if: ${{ (inputs.profile || 'full') == 'full' }}
        run: just quality
      - name: Correctness lint
        if: ${{ inputs.profile == 'deploy' }}
        run: just lint-correctness
      - run: npm run typecheck
      - name: Install Chromium
        run: |
          if node -e "process.exit(require('./package.json').devDependencies?.['@e2e-dev/web'] ? 0 : 1)"; then
            npm exec -- e2e-web install chromium
          else
            npm exec -- playwright install chromium
          fi
      - name: Qualify packed package and browser
        run: npm run qualify
      - name: Preserve native E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-e2e-${{ github.sha }}
          path: output/e2e/
          if-no-files-found: ignore

  result:
    name: Qualification result
    if: ${{ always() }}
    needs: correctness
    runs-on: [self-hosted, Linux, X64, nextide-ci-docker]
    timeout-minutes: 5
    steps:
      - name: Require selected groups
        env:
          PROFILE: ${{ inputs.profile || 'full' }}
          SOURCE_SHA: ${{ needs.correctness.outputs.sha || inputs.source_sha || github.sha }}
          CORRECTNESS: ${{ needs.correctness.result }}
        run: |
          node <<'NODE'
          const { PROFILE, SOURCE_SHA, CORRECTNESS } = process.env;
          console.log(`Qualification ${PROFILE}: ${SOURCE_SHA}; Correctness=${CORRECTNESS}`);
          if (!["full", "deploy"].includes(PROFILE) || CORRECTNESS !== "success") {
            process.exit(1);
          }
          NODE
