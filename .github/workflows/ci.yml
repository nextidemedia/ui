name: Qualification
run-name: Qualification (${{ inputs.profile || 'full' }})

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        type: choice
        options: [full, deploy]
        default: full
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      source_sha:
        description: Exact release commit to validate
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}-${{ inputs.profile || 'full' }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    if: ${{ (inputs.profile || 'full') == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.0"
      - run: npm run format:check
      - run: npm run lint
      - run: uv run --no-project --python 3.15 python scripts/check_loc.py

  correctness:
    name: Correctness / Package and browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate profile
        env:
          PROFILE: ${{ inputs.profile || 'full' }}
        run: |
          case "$PROFILE" in full|deploy) ;; *) echo "Unknown profile: $PROFILE"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Correctness lint
        run: just lint-correctness
      - run: npm run typecheck
      - name: Install Chromium
        run: |
          if node -e "process.exit(require('./package.json').devDependencies?.['@e2e-dev/web'] ? 0 : 1)"; then
            npm exec -- e2e-web install chromium --with-deps
          else
            npm exec -- playwright install --with-deps chromium
          fi
      - name: Qualify packed package and browser
        run: npm run qualify
      - name: Preserve native E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-e2e-${{ github.sha }}
          path: output/e2e/
          if-no-files-found: ignore

  result:
    name: Qualification result
    if: ${{ always() }}
    needs: [quality, correctness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected groups
        env:
          PROFILE: ${{ inputs.profile || 'full' }}
          SOURCE_SHA: ${{ needs.correctness.outputs.sha || inputs.source_sha || github.sha }}
          QUALITY: ${{ needs.quality.result }}
          CORRECTNESS: ${{ needs.correctness.result }}
        run: |
          node <<'NODE'
          const { PROFILE, SOURCE_SHA, QUALITY, CORRECTNESS } = process.env;
          console.log(`Qualification ${PROFILE}: ${SOURCE_SHA}; Quality=${QUALITY}; Correctness=${CORRECTNESS}`);
          const expectedQuality = { full: "success", deploy: "skipped" }[PROFILE];
          if (!expectedQuality || QUALITY !== expectedQuality || CORRECTNESS !== "success") {
            process.exit(1);
          }
          NODE
