name: Qualification
run-name: Qualification (${{ inputs.profile || 'full' }})

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged commit to qualify (defaults to selected ref)
        type: string
        required: false
      profile:
        description: Validation profile
        type: choice
        options: [full, deploy]
        default: full
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      source_sha:
        description: Exact release commit to validate
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}-${{ inputs.profile || 'full' }}
  cancel-in-progress: true

jobs:
  correctness:
    permissions:
      contents: read
      id-token: write
    name: Correctness / Package and browser
    runs-on: [self-hosted, Linux, X64, nextide-ci-docker]
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate profile
        env:
          PROFILE: ${{ inputs.profile || 'full' }}
        run: |
          case "$PROFILE" in full|deploy) ;; *) echo "Unknown profile: $PROFILE"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 2
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Preserve merged-result qualification. For an automatic update, prove
      # that result's tree is also the exact verified dependency head's tree.
      - name: Inspect dependency qualification source
        id: dependency-source
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        continue-on-error: true
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          expected_tree=$(git rev-parse "$EXPECTED_HEAD^{tree}")
          if [ "$(git rev-parse HEAD^{tree})" = "$expected_tree" ]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
          fi
      # Expose positive source evidence through native job-step metadata without
      # failing merged-result qualification for an agent-owned update.
      - name: Verify dependency qualification source
        if: steps.dependency-source.outcome == 'success' && steps.dependency-source.outputs.matches == 'true'
        run: echo 'Merged-result qualification matches the dependency head.'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - name: Install just
        # Direct asset installation avoids the release-discovery failure on fresh runners.
        # SHA-256 from casey/just's official 1.59.0 SHA256SUMS release asset.
        run: |
          archive="just-1.59.0-x86_64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/just-1.59.0"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/casey/just/releases/download/1.59.0/$archive" \
            --output "$install_dir/$archive"
          printf '%s  %s\n' \
            '409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e' \
            "$install_dir/$archive" | sha256sum --check --strict
          tar -xzf "$install_dir/$archive" -C "$install_dir" just
          "$install_dir/just" --version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Quality
        if: ${{ (inputs.profile || 'full') == 'full' }}
        run: just quality
      - name: Correctness lint
        if: ${{ inputs.profile == 'deploy' }}
        run: just lint-correctness
      - run: npm run typecheck
      - name: Install Chromium
        run: |
          if node -e "process.exit(require('./package.json').devDependencies?.['@e2e-dev/web'] ? 0 : 1)"; then
            npm exec -- e2e-web install chromium
          else
            npm exec -- playwright install chromium
          fi
      - name: Qualify packed package and browser
        run: npm run qualify
      - name: Preserve native E2E evidence
        if: ${{ always() && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')) }}
        uses: nextidemedia/ui/.github/actions/upload-owned-artifact@2344a59e3863da5d89780163004bb175f01dd626
        with:
          name: native-e2e-${{ steps.source.outputs.sha }}
          path: output/e2e/
          if-no-files-found: ignore
      - if: ${{ always() && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        run: echo 'Owned artifact uploads are unavailable for fork and Dependabot checks.' >> "$GITHUB_STEP_SUMMARY"

      - name: Qualification summary
        if: ${{ always() }}
        env:
          PROFILE: ${{ inputs.profile || 'full' }}
          SOURCE_SHA: ${{ steps.source.outputs.sha || inputs.source_sha || github.sha }}
          CORRECTNESS: ${{ job.status }}
        run: |
          printf 'Qualification %s: %s; Correctness=%s\n' "$PROFILE" "$SOURCE_SHA" "$CORRECTNESS" | tee -a "$GITHUB_STEP_SUMMARY"
