version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      react:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      build-toolchain:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/*"
          - typescript
          - tailwindcss
          - "@tailwindcss/*"
        update-types:
          - minor
          - patch
      runtime:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      tooling:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
